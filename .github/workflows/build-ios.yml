name: Build Jev iPhone keyboard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Fetch pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: jev-chat/jev-chat-jarvis-ios
          ref: f4b64cc655415091180e4c0573a2a82ca4319212
          persist-credentials: false

      - name: Prepare Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Verify shared behavior
        shell: bash
        run: |
          set -euo pipefail
          swiftc -o "$RUNNER_TEMP/jevcheck" tools/PromptCheck/main.swift Shared/*.swift
          "$RUNNER_TEMP/jevcheck"

      - name: Compile application and keyboard extension
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project JevJarvis.xcodeproj -scheme JevJarvis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/JevBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build

      - name: Package IPA for local re-signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          app="$RUNNER_TEMP/JevBuild/Build/Products/Release-iphoneos/JevJarvis.app"
          test -d "$app/PlugIns/JevKeyboard.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$app/PlugIns/JevKeyboard.appex/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          # Ad-hoc signatures preserve entitlements for the local signing tool.
          # They are not Apple device provisioning signatures.
          codesign --force --sign - --entitlements Keyboard/JevKeyboard.entitlements "$app/PlugIns/JevKeyboard.appex"
          codesign --force --sign - --entitlements App/JevJarvis.entitlements "$app"
          codesign --verify --deep --strict "$app"
          cp -R "$app" "$RUNNER_TEMP/package/Payload/"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/JevKeyboard-resign.ipa" Payload)
          cp LICENSE NOTICE dist/
          printf '%s\n' 'Source: https://github.com/jev-chat/jev-chat-jarvis-ios' \
            'Commit: f4b64cc655415091180e4c0573a2a82ca4319212' \
            'Personal build; not an official release. Re-sign locally with your Apple ID before installing.' \
            'Retain the JevKeyboard extension. API keys must be entered locally, never in this repository.' > dist/BUILD-INFO.txt
          shasum -a 256 dist/JevKeyboard-resign.ipa > dist/SHA256SUMS.txt

      - name: Upload install preparation package
        uses: actions/upload-artifact@v4
        with:
          name: JevKeyboard-resign
          path: dist/
          retention-days: 7
          if-no-files-found: error
